name: Проверки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v7

      - name: Поставить Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Поставить зависимости
        run: npm ci

      - name: Проверить
        run: make check
