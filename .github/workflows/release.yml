name: Релиз

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрать код
        uses: actions/checkout@v7

      - name: Поставить Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Поставить зависимости
        run: npm ci

      - name: Проверить и собрать
        run: make check

      - name: Сверить версию с тегом
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: make version-check ARGS="$TAG_NAME"

      - name: Приложить артефакты
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          assets=(dist/main.js dist/manifest.json)
          if [ -f dist/styles.css ]; then
            assets+=(dist/styles.css)
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
